name: NetPulse
options:
  bundleIdPrefix: com.netpulse
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"

targets:
  NetPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NetPulse/App
      - path: NetPulse/Models
      - path: NetPulse/Services
      - path: NetPulse/Views
      - path: NetPulse/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netpulse.ios
        INFOPLIST_FILE: NetPulse/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"

  NetPulseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NetPulseTests
    dependencies:
      - target: NetPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netpulse.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NetPulse.app/NetPulse"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NetPulse:
    build:
      targets:
        NetPulse: all
        NetPulseTests: [test]
    test:
      config: Debug
      targets:
        - NetPulseTests
