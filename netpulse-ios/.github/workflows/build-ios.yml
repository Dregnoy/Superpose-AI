name: Build & Test NetPulse iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project directory
        id: proj
        run: |
          if [ -f "project.yml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "netpulse-ios/project.yml" ]; then
            echo "dir=netpulse-ios" >> "$GITHUB_OUTPUT"
          else
            echo "project.yml bulunamadi!" && ls -la && exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xcodegen generate

      - name: Pick available iOS Simulator destination
        id: sim
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          DEST=$(xcodebuild -project NetPulse.xcodeproj -scheme NetPulse -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -v 'placeholder' | head -n 1 \
            | sed -E 's/.*id:([^,]+).*/\1/')
          if [ -z "$DEST" ]; then
            echo "dest=platform=iOS Simulator,name=iPhone 16" >> "$GITHUB_OUTPUT"
          else
            echo "dest=platform=iOS Simulator,id=$DEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NetPulseTests on iOS Simulator
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          xcodebuild test \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -destination "${{ steps.sim.outputs.dest }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release iphoneos app
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          xcodebuild clean build \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned NetPulse.ipa
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/NetPulse.app out/Payload/NetPulse.app
          cd out
          zip -qry ../NetPulse.ipa Payload
          ls -lh ../NetPulse.ipa

      - name: Upload unsigned NetPulse.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Unsigned-IPA
          path: ${{ steps.proj.outputs.dir }}/NetPulse.ipa
          if-no-files-found: error
