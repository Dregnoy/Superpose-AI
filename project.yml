name: SuperposeAI
options:
  bundleIdPrefix: com.superposelabs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.8"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SuperposeAI:
    type: application
    platform: iOS
    sources:
      - path: SuperposeAI
        excludes:
          - Resources/Products.storekit
          - App/Info.plist
      - path: SuperposeShared
    resources:
      - path: SuperposeAI/Resources/Products.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superposelabs.superpose
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Superpose
        INFOPLIST_KEY_NSCameraUsageDescription: "Superpose needs camera access to provide real-time lighting, framing, and pose overlay guidance."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Superpose uses the microphone only when Voice Shutter is enabled to listen for the 'Çek' command."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Superpose uses on-device speech recognition when Voice Shutter is enabled."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Superpose needs permission to save your captured photos to your Photo Library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Superpose needs photo library access so you can import a photo to generate pose ideas."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SuperposeWidgetExtension
        embed: true
  SuperposeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperposeWidget
        excludes:
          - Info.plist
      - path: SuperposeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superposelabs.superpose.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuperposeWidget/Info.plist
        SKIP_INSTALL: YES
  SuperposeAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperposeAITests
    dependencies:
      - target: SuperposeAI
  SuperposeAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SuperposeAIUITests
    dependencies:
      - target: SuperposeAI
schemes:
  SuperposeAI:
    build:
      targets:
        SuperposeAI: all
        SuperposeAITests: [test]
        SuperposeAIUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SuperposeAI/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - SuperposeAITests
        - SuperposeAIUITests
