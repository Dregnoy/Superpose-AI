name: BluePad
options:
  bundleIdPrefix: com.bluepad
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  BluePad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BluePad/App
      - path: BluePad/Models
      - path: BluePad/Services
      - path: BluePad/Views
      - path: BluePad/Resources/Assets.xcassets
    
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluepad.ios
        INFOPLIST_FILE: BluePad/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"

  BluePadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BluePadTests
    dependencies:
      - target: BluePad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluepad.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
