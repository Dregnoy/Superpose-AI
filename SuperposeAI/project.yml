name: SuperposeAI
options:
  bundleIdPrefix: com.superposelabs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.8"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SuperposeAI:
    type: application
    platform: iOS
    sources:
      - path: SuperposeAI
        excludes:
          - Resources/Products.storekit
    resources:
      - path: SuperposeAI/Resources/Products.storekit
      - path: SuperposeAI/Resources/Localizable.xcstrings
    info:
      path: SuperposeAI/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superposelabs.superpose
        INFOPLIST_FILE: SuperposeAI/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  SuperposeAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperposeAITests
    dependencies:
      - target: SuperposeAI
schemes:
  SuperposeAI:
    build:
      targets:
        SuperposeAI: all
        SuperposeAITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SuperposeAI/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - SuperposeAITests
